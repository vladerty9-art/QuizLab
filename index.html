<script>
const QUIZZES=[{"id": "math-percent", "subject": "Математика", "topic": "Проценты", "level": "ОГЭ", "questions": [{"q": "В магазине цена товара 800 рублей. После скидки 15% сколько стоит товар?", "options": ["680 рублей", "700 рублей", "720 рублей", "760 рублей"], "a": 0, "hint": "Найди 15% от 800 и вычти эту сумму из первоначальной цены.", "explain": "15% от 800 = 0,15 × 800 = 120 рублей. Новая цена: 800 − 120 = 680 рублей."}, {"q": "Число увеличили на 20% и получили 360. Чему равно исходное число?", "options": ["288", "300", "320", "340"], "a": 1, "hint": "После увеличения на 20% получилось 120% исходного числа.", "explain": "Пусть исходное число x. Тогда 1,2x = 360, откуда x = 360 / 1,2 = 300."}, {"q": "В классе 25 учеников, 40% из них посещают секцию. Сколько это учеников?", "options": ["8", "10", "12", "15"], "a": 1, "hint": "Переведи 40% в десятичную дробь и умножь на 25.", "explain": "40% = 0,4. 25 × 0,4 = 10 учеников."}, {"q": "Стоимость услуги выросла с 500 до 575 рублей. На сколько процентов она выросла?", "options": ["10%", "12%", "15%", "20%"], "a": 2, "hint": "Сначала найди прирост, затем раздели его на первоначальную стоимость.", "explain": "Прирост равен 575 − 500 = 75 рублей. 75 / 500 × 100% = 15%."}, {"q": "После скидки 10% товар стоит 900 рублей. Сколько он стоил до скидки?", "options": ["990 рублей", "1000 рублей", "1010 рублей", "1100 рублей"], "a": 1, "hint": "900 рублей — это 90% первоначальной цены.", "explain": "0,9x = 900. Значит, x = 900 / 0,9 = 1000 рублей."}]}, {"id": "math-equations", "subject": "Математика", "topic": "Линейные уравнения", "level": "ОГЭ", "questions": [{"q": "Решите уравнение: 3x − 7 = 11.", "options": ["4", "5", "6", "7"], "a": 2, "hint": "Перенеси −7 в правую часть, затем раздели на 3.", "explain": "3x − 7 = 11; 3x = 18; x = 6."}, {"q": "Решите уравнение: 5(x − 2) = 20.", "options": ["2", "4", "6", "8"], "a": 2, "hint": "Сначала раздели обе части на 5.", "explain": "x − 2 = 4, поэтому x = 6."}, {"q": "При каком x выражения 2x + 3 и 15 равны?", "options": ["5", "6", "7", "9"], "a": 1, "hint": "Составь уравнение 2x + 3 = 15.", "explain": "2x = 12, следовательно x = 6. Правильный вариант — 6.", "_fix": true}, {"q": "Решите уравнение: 4x + 8 = 0.", "options": ["−4", "−2", "2", "4"], "a": 1, "hint": "Вычти 8 из обеих частей и раздели на 4.", "explain": "4x = −8, значит x = −2."}, {"q": "Корень уравнения 7x = 56 равен…", "options": ["6", "7", "8", "9"], "a": 2, "hint": "Раздели 56 на коэффициент при x.", "explain": "x = 56 / 7 = 8."}]}, {"id": "physics-density", "subject": "Физика", "topic": "Плотность вещества", "level": "ОГЭ", "questions": [{"q": "Масса тела 540 г, объём 200 см³. Чему равна плотность?", "options": ["0,37 г/см³", "2,7 г/см³", "27 г/см³", "740 г/см³"], "a": 1, "hint": "Используй формулу ρ = m / V.", "explain": "ρ = 540 / 200 = 2,7 г/см³."}, {"q": "Какова масса алюминиевого бруска объёмом 100 см³? Плотность алюминия 2,7 г/см³.", "options": ["27 г", "100 г", "270 г", "2700 г"], "a": 2, "hint": "Масса равна плотности, умноженной на объём.", "explain": "m = ρV = 2,7 × 100 = 270 г."}, {"q": "В каких единицах в СИ измеряется плотность?", "options": ["кг", "м³", "кг/м³", "Н/м³"], "a": 2, "hint": "Плотность — это масса, делённая на объём.", "explain": "В СИ масса измеряется в килограммах, объём — в кубических метрах, поэтому плотность измеряется в кг/м³."}, {"q": "Тело имеет массу 2 кг и объём 0,001 м³. Найдите плотность.", "options": ["200 кг/м³", "500 кг/м³", "1000 кг/м³", "2000 кг/м³"], "a": 3, "hint": "Раздели массу на объём.", "explain": "ρ = 2 / 0,001 = 2000 кг/м³."}, {"q": "Два тела имеют одинаковый объём. У первого масса больше. Что можно сказать о плотности?", "options": ["Плотности равны", "У первого плотность больше", "У второго плотность больше", "Недостаточно данных"], "a": 1, "hint": "При одинаковом объёме плотность прямо пропорциональна массе.", "explain": "ρ = m/V. При одинаковом V большее значение массы означает большую плотность."}]}, {"id": "physics-speed", "subject": "Физика", "topic": "Скорость, путь и время", "level": "ОГЭ", "questions": [{"q": "Автомобиль проехал 150 км за 3 часа. Какова его средняя скорость?", "options": ["30 км/ч", "45 км/ч", "50 км/ч", "60 км/ч"], "a": 2, "hint": "Скорость равна пути, делённому на время.", "explain": "v = S/t = 150/3 = 50 км/ч."}, {"q": "Поезд движется со скоростью 20 м/с в течение 10 с. Какой путь он пройдёт?", "options": ["2 м", "20 м", "100 м", "200 м"], "a": 3, "hint": "Используй формулу S = vt.", "explain": "S = 20 × 10 = 200 м."}, {"q": "Пешеход прошёл 6 км со скоростью 4 км/ч. Сколько времени занял путь?", "options": ["1 ч", "1,5 ч", "2 ч", "2,5 ч"], "a": 1, "hint": "Время равно пути, делённому на скорость.", "explain": "t = 6/4 = 1,5 часа."}, {"q": "Скорость 72 км/ч равна…", "options": ["10 м/с", "15 м/с", "20 м/с", "25 м/с"], "a": 2, "hint": "Чтобы перевести км/ч в м/с, раздели на 3,6.", "explain": "72 / 3,6 = 20 м/с."}, {"q": "Тело двигалось 5 с со скоростью 3 м/с, затем 5 с со скоростью 5 м/с. Какой путь оно прошло?", "options": ["25 м", "35 м", "40 м", "50 м"], "a": 2, "hint": "Найди путь на каждом участке и сложи.", "explain": "S₁ = 3 × 5 = 15 м; S₂ = 5 × 5 = 25 м. Всего 40 м.", "_fix": true}]}], CATALOG=[{"subject": "Математика", "topic": "Числа и вычисления", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Дроби и степени", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Проценты", "quizId": "math-percent", "status": "ready"}, {"subject": "Математика", "topic": "Отношения и пропорции", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Алгебраические выражения", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Линейные уравнения", "quizId": "math-equations", "status": "ready"}, {"subject": "Математика", "topic": "Квадратные уравнения", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Неравенства", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Функции и графики", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Последовательности", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Текстовые задачи", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Геометрия: углы", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Треугольники", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Четырёхугольники", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Окружность", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Площади фигур", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Координатная плоскость", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Вероятность", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Статистика", "quizId": null, "status": "planned"}, {"subject": "Математика", "topic": "Практические задачи", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Механическое движение", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Скорость, путь и время", "quizId": "physics-speed", "status": "ready"}, {"subject": "Физика", "topic": "Плотность вещества", "quizId": "physics-density", "status": "ready"}, {"subject": "Физика", "topic": "Сила тяжести и вес", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Давление твёрдых тел", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Давление жидкостей и газов", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Архимедова сила", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Работа и мощность", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Энергия", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Тепловые явления", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Количество теплоты", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Плавление и парообразование", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Тепловые двигатели", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Электрический ток", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Сила тока и напряжение", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Сопротивление", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Закон Ома", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Электрические цепи", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Магнитные явления", "quizId": null, "status": "planned"}, {"subject": "Физика", "topic": "Оптика", "quizId": null, "status": "planned"}];
const screen=document.getElementById('screen');let page='home',active=null,qi=0,chosen=null,checked=false,showHint=false;
let history=JSON.parse(localStorage.getItem('ql-history')||'[]');
function save(){localStorage.setItem('ql-history',JSON.stringify(history))}
function go(p){page=p;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===p));render()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>go(x.dataset.tab));
function start(id){active=QUIZZES.find(x=>x.id===id);qi=0;chosen=null;checked=false;showHint=false;page='play';render()}
function render(){
 if(page==='home') home(); else if(page==='catalog') catalog(); else if(page==='stats') stats(); else if(page==='play') play(); else if(page==='result') result();
}
function home(){
 const done=history.length, avg=done?Math.round(history.reduce((s,x)=>s+x.percent,0)/done):0;
 screen.innerHTML=`<div class="card hero"><div class="eyebrow">ТВОЯ ПОДГОТОВКА К ОГЭ</div><div class="h">Тренируйся понемногу каждый день</div><div class="muted">Решай задания, открывай подсказки и разбирай ошибки.</div><button class="btn" onclick="go('catalog')">Выбрать квиз →</button></div>
 <div class="stats"><div class="stat"><span class="muted">Попыток</span><strong>${done}</strong></div><div class="stat"><span class="muted">Средний результат</span><strong>${done?avg+'%':'—'}</strong></div></div>
 <div class="section">Предметы</div><div class="subjects"><button class="subject" onclick="filterSubject='Математика';go('catalog')"><span class="emoji">📐</span><strong>Математика</strong><span class="muted">20 тем ОГЭ</span></button><button class="subject" onclick="filterSubject='Физика';go('catalog')"><span class="emoji">⚛️</span><strong>Физика</strong><span class="muted">20 тем ОГЭ</span></button></div>
 <div class="section">Можно решить сейчас</div>${QUIZZES.map(q=>`<div class="topic"><div class="row"><span class="pill">${q.subject}</span><span class="status">Готово</span></div><strong>${q.topic}</strong><div class="muted">${q.questions.length} вопросов · с подсказками</div><button class="btn secondary" onclick="start('${q.id}')">Начать</button></div>`).join('')}`;
}
let filterSubject='Все';
function catalog(){
 const list=CATALOG.filter(x=>filterSubject==='Все'||x.subject===filterSubject);
 screen.innerHTML=`<div class="h">Каталог квизов</div><div class="muted">40 тематических направлений подготовки к ОГЭ</div><div class="row" style="margin:15px 0"><button class="btn ${filterSubject==='Все'?'':'ghost'}" onclick="filterSubject='Все';catalog()">Все</button><button class="btn ${filterSubject==='Математика'?'':'ghost'}" onclick="filterSubject='Математика';catalog()">Математика</button><button class="btn ${filterSubject==='Физика'?'':'ghost'}" onclick="filterSubject='Физика';catalog()">Физика</button></div>${list.map(x=>`<div class="topic"><div class="row"><strong>${x.topic}</strong><span class="status ${x.status==='ready'?'':'soon'}">${x.status==='ready'?'Доступен':'Скоро'}</span></div><div class="muted">${x.subject} · ОГЭ</div>${x.quizId?`<button class="btn secondary" onclick="start('${x.quizId}')">Решать квиз</button>`:''}</div>`).join('')}`;
}
function play(){
 const q=active.questions[qi],pct=Math.round(qi/active.questions.length*100);
 screen.innerHTML=`<div class="row"><button class="btn ghost" style="width:auto;margin:0" onclick="go('catalog')">← К списку</button><span class="pill">${active.subject}</span></div><div class="row" style="margin-top:18px"><span class="eyebrow">${active.topic}</span><span class="eyebrow">${qi+1} / ${active.questions.length}</span></div><div class="qtop"><span style="width:${pct}%"></span></div><div class="question">${q.q}</div>${q.options.map((o,i)=>`<button class="option ${chosen===i?(checked?(i===q.a?'correct':'wrong'):'selected'):''}" ${checked?'disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
 <button class="btn secondary" onclick="toggleHint()">${showHint?'Скрыть подсказку':'💡 Показать подсказку'}</button>${showHint?`<div class="hint">${q.hint}</div>`:''}
 ${checked?`<div class="feedback ${chosen===q.a?'good':'bad'}"><strong>${chosen===q.a?'Верно!':'Пока неверно'}</strong><br>${q.explain}</div><button class="btn" onclick="next()">${qi===active.questions.length-1?'Завершить квиз':'Следующий вопрос →'}</button>`:`<button class="btn" ${chosen===null?'disabled style="opacity:.45"':''} onclick="check()">Проверить ответ</button>`}`;
}
function choose(i){if(checked)return;chosen=i;render()}
function toggleHint(){showHint=!showHint;render()}
function check(){if(chosen===null)return;checked=true;render()}
function next(){if(qi<active.questions.length-1){qi++;chosen=null;checked=false;showHint=false;render()}else{let score=active.questions.reduce((s,q,i)=>s+(answers[i]===q.a?1:0),0);history.push({id:active.id,topic:active.topic,subject:active.subject,score,total:active.questions.length,percent:Math.round(score/active.questions.length*100),date:new Date().toISOString()});save();page='result';render()}}
let answers=[];
const oldCheck=check;
function check(){if(chosen===null)return;answers[qi]=chosen;checked=true;render()}
function start(id){active=QUIZZES.find(x=>x.id===id);qi=0;chosen=null;checked=false;showHint=false;answers=[];page='play';render()}
function result(){const last=history[history.length-1];screen.innerHTML=`<div class="empty"><div style="font-size:52px">🎉</div><div class="h">Квиз завершён!</div><div class="muted">${last.topic}</div><div style="font-size:48px;font-weight:850;color:var(--blue);margin:18px">${last.percent}%</div><div class="muted">Правильных ответов: ${last.score} из ${last.total}</div><button class="btn" onclick="go('catalog')">Выбрать следующий квиз</button><button class="btn ghost" onclick="go('stats')">Посмотреть прогресс</button></div>`}
function stats(){
 const done=history.length,avg=done?Math.round(history.reduce((s,x)=>s+x.percent,0)/done):0;
 const by={};history.forEach(x=>{by[x.subject]??=[];by[x.subject].push(x.percent)});
 screen.innerHTML=`<div class="h">Мой прогресс</div><div class="muted">Результаты сохраняются на этом устройстве.</div><div class="stats" style="margin:16px 0"><div class="stat"><span class="muted">Решено квизов</span><strong>${done}</strong></div><div class="stat"><span class="muted">Средний балл</span><strong>${done?avg+'%':'—'}</strong></div></div>${['Математика','Физика'].map(s=>{let a=by[s]||[],v=a.length?Math.round(a.reduce((t,n)=>t+n,0)/a.length):0;return `<div class="card"><div class="row"><strong>${s}</strong><strong>${a.length?v+'%':'—'}</strong></div><div class="bar" style="margin:12px 0"><span style="width:${v}%"></span></div><div class="muted">${a.length} попыток</div></div>`}).join('')}<div class="section">Последние попытки</div>${history.slice(-8).reverse().map(x=>`<div class="topic"><div class="row"><strong>${x.topic}</strong><span class="pill">${x.percent}%</span></div><div class="muted">${x.subject} · ${new Date(x.date).toLocaleDateString('ru-RU')}</div></div>`).join('')||'<div class="empty">Пока нет попыток. Реши первый квиз!</div>'}<button class="btn ghost" onclick="if(confirm('Удалить историю результатов?')){history=[];save();stats()}">Очистить историю</button>`;
}
render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
